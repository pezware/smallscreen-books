# Toolchain for this repo. `mise install` reproduces it on any machine.
#
# The generator is stdlib-only on purpose — a book build should not depend on
# a package index. uv is here for the dev tools and the lockfile, not for
# runtime dependencies.

[tools]
python = "3.12"
uv = "0.12"
# For tools/fit, the host-side line measurer. The firmware's own test suite
# builds with CMake; this matches it rather than inventing a second build.
cmake = "4.2"

[tasks.build]
description = "Build the Spanish frequency list from the corpus in data/es/raw"
run = "uv run python src/frequency.py"

[tasks.test]
description = "Run the test suite"
run = "uv run python -m unittest discover -s tests -t tests"

[tasks.lint]
description = "Check formatting and lint"
run = ["uv run ruff format --check .", "uv run ruff check ."]

[tasks.fmt]
description = "Apply formatting"
run = "uv run ruff format ."

[tasks.fit]
description = "Measure how many lines Spanish prose takes, using the device's own line breaker"
run = """
cmake -S tools/fit -B build/fit -DCROSSPOINT_ROOT="${CROSSPOINT_ROOT:?set CROSSPOINT_ROOT to a crosspoint-reader checkout}"
cmake --build build/fit -j
echo "built: build/fit/fit"
echo "measure: python3 tools/fit/probe.py | ./build/fit/fit --size 16"
"""
